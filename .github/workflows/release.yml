name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.5'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android-apk
            os: ubuntu-latest
            ext: apk
            artifact: VVVPN-Android.apk
          - platform: windows
            os: windows-latest
            ext: zip
            artifact: VVVPN-Windows-Portable-x64.zip
          - platform: macos
            os: macos-15
            ext: dmg
            artifact: VVVPN-macOS.dmg
          - platform: linux
            os: ubuntu-22.04
            ext: AppImage
            artifact: VVVPN-Linux-x64.AppImage
          # linux-arm64 暂搁 —— Flutter 团队不发布 Linux ARM64 SDK 二进制，
          # subosito/flutter-action 在 ubuntu-22.04-arm 上拿不到 SDK 直接挂。
          # 想加必须先在 runner 上从源码 build Flutter（~15-20 min，脆弱）。

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Free disk (Android only)
        if: startsWith(matrix.platform, 'android')
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          rm -rf ~/.gradle/caches
          sudo apt-get autoremove -y && sudo apt-get clean
          df -h

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Java (Android)
        if: startsWith(matrix.platform, 'android')
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android SDK
        if: startsWith(matrix.platform, 'android')
        uses: android-actions/setup-android@v3

      - name: Cache Gradle (Android)
        if: startsWith(matrix.platform, 'android')
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install platform deps
        run: make ${{ matrix.platform }}-install-deps
        env:
          IS_GITHUB_ACTIONS: 1

      - name: Prepare
        run: make ${{ matrix.platform }}-prepare
        env:
          IS_GITHUB_ACTIONS: 1

      - name: Build
        run: make ${{ matrix.platform }}-release
        env:
          IS_GITHUB_ACTIONS: 1
          CHANNEL: prod

      # flutter build macos 出来的 .app 里，launch_at_startup 插件的嵌套
      # LaunchAtLoginHelper.app 签名校验不过（codesign -v 报 invalid Info.plist）。
      # Apple Silicon 要求有效签名才能执行，未公证 + 嵌套签名失效 → 用户侧
      # 报「已损坏，无法打开」，且右键打开无效。这里拆开 dmg、对 .app 做整包
      # deep ad-hoc 重签、再重打 dmg —— 把「已损坏」消掉。
      # 注：彻底零提示需 Apple Developer ID 签名 + 公证，待商务账号到位。
      - name: Re-sign macOS app (deep ad-hoc) and repack dmg
        if: matrix.platform == 'macos'
        run: |
          set -euxo pipefail
          dmg=$(find dist build -type f -name "*.dmg" | head -n1)
          echo "dmg: $dmg"
          mnt=$(mktemp -d); work=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -mountpoint "$mnt"
          cp -R "$mnt"/*.app "$work"/
          hdiutil detach "$mnt"
          app=$(find "$work" -maxdepth 1 -name "*.app" | head -n1)
          codesign --force --deep --sign - "$app"
          codesign -v --verbose=2 "$app"
          ln -s /Applications "$work/Applications"
          rm -f "$dmg"
          hdiutil create -volname VVVPN -srcfolder "$work" -ov -format UDZO "$dmg"

      # Hiddify Makefile 的 windows-zip-release 用 `tar -a -cf <name>.zip Hiddify`
      # 妄图靠 -a 自动选 zip 格式，但 windows-latest runner 的 tar 不识别 zip
      # 后缀，造出来是 tar 改名 — Windows 双击 "无效的 zip"。
      # 这里检查 magic，遇到非 PK 开头的就解压重打成真 zip。
      #
      # 顺便一刀:剔除 bundled msvcp140/vcruntime140/vcruntime140_1.dll。
      # Flutter Windows runner 自带的 VC++ runtime 是 14.34 (2022 vintage),
      # WebView2 v148+ 用 14.50 API 编译,Windows DLL 搜索顺序优先 app 目录
      # → 旧 dll 被强加载 → WebView2 调函数 NULL 返回 → 整进程 0xc0000005 闪退。
      # 删掉 → 落到 system32 C++ runtime (Win10/11 自带 14.42+ 兼容)。
      # v4.1.7-v4.1.11 用户「点登录瞬间闪退」就是这个坑;v4.1.12 起 CI 永久剔除。
      - name: Repack Windows zip + strip bundled VC++ runtime
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $stripDlls = @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll",
                         "vcruntime140_threads.dll", "concrt140.dll")
          Get-ChildItem -Recurse -Path dist -Filter "*.zip" | ForEach-Object {
            $f = $_.FullName
            $bytes = [System.IO.File]::ReadAllBytes($f) | Select-Object -First 4
            $isPK = ($bytes[0] -eq 0x50 -and $bytes[1] -eq 0x4B)

            $tmp = Join-Path $env:RUNNER_TEMP "winzip-extract"
            if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
            New-Item -ItemType Directory -Path $tmp -Force | Out-Null

            if (-not $isPK) {
              Write-Host "Extracting $f (was tar)"
              tar -xf $f -C $tmp
            } else {
              Write-Host "Extracting $f (real zip)"
              Expand-Archive -Path $f -DestinationPath $tmp -Force
            }

            # Strip bundled VC++ runtime DLLs
            foreach ($dll in $stripDlls) {
              Get-ChildItem -Path $tmp -Recurse -Filter $dll -ErrorAction SilentlyContinue | ForEach-Object {
                Write-Host "  removing bundled $($_.FullName)"
                Remove-Item $_.FullName -Force
              }
            }

            # Repack as real zip
            Remove-Item $f
            Compress-Archive -Path "$tmp\*" -DestinationPath $f
            Write-Host "Repacked $f -> $((Get-Item $f).Length) bytes"
          }

      - name: Locate artifact (POSIX)
        if: matrix.os != 'windows-latest'
        id: find_unix
        run: |
          set -euxo pipefail
          path=$(find dist build -type f -name "*.${{ matrix.ext }}" 2>/dev/null | head -n1)
          if [ -z "$path" ]; then
            echo "no .${{ matrix.ext }} artifact found"
            find dist build -type f 2>/dev/null | head -50
            exit 1
          fi
          cp "$path" "${{ matrix.artifact }}"
          echo "path=${{ matrix.artifact }}" >> "$GITHUB_OUTPUT"

      - name: Locate artifact (Windows)
        if: matrix.os == 'windows-latest'
        id: find_win
        shell: pwsh
        run: |
          $file = Get-ChildItem -Recurse -Path dist,build -Filter "*.${{ matrix.ext }}" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $file) {
            Get-ChildItem -Recurse -Path dist,build -ErrorAction SilentlyContinue | Select-Object FullName -First 50
            throw "no .${{ matrix.ext }} artifact found"
          }
          Copy-Item $file.FullName -Destination "${{ matrix.artifact }}"
          "path=${{ matrix.artifact }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload artifact (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish-r2:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_BUCKET: ${{ vars.R2_BUCKET_NAME || secrets.R2_BUCKET_NAME || 'vvvpn-storage' }}
      DOWNLOAD_BASE_URL: ${{ vars.CLIENT_DOWNLOAD_BASE_URL || secrets.CLIENT_DOWNLOAD_BASE_URL || 'https://download.vvvpn168.com' }}
    steps:
      - uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Build release manifest
        run: |
          set -euo pipefail
          version_line=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          app_version="${version_line%%+*}"
          build_number="${version_line#*+}"
          release_version="v${app_version}"
          published_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          base_url="${DOWNLOAD_BASE_URL%/}"

          export RELEASE_VERSION="$release_version"
          export APP_VERSION="$app_version"
          export BUILD_NUMBER="$build_number"
          export PUBLISHED_AT="$published_at"
          export BASE_URL="$base_url"

          node <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");

          const files = {
            android: "VVVPN-Android.apk",
            windows: "VVVPN-Windows-Portable-x64.zip",
            macos: "VVVPN-macOS.dmg",
            linux: "VVVPN-Linux-x64.AppImage",
          };

          const manifest = {
            version: process.env.RELEASE_VERSION,
            appVersion: process.env.APP_VERSION,
            buildNumber: process.env.BUILD_NUMBER,
            publishedAt: process.env.PUBLISHED_AT,
            source: {
              repository: "vvvpn168/vvvpn-client",
              branch: process.env.GITHUB_REF_NAME,
              commit: process.env.GITHUB_SHA,
              runId: process.env.GITHUB_RUN_ID,
            },
            artifacts: {},
          };

          for (const [platform, fileName] of Object.entries(files)) {
            const filePath = `release-artifacts/${fileName}`;
            if (!fs.existsSync(filePath)) {
              throw new Error(`missing artifact: ${filePath}`);
            }
            const bytes = fs.readFileSync(filePath);
            const r2Key = `download/${process.env.RELEASE_VERSION}/${fileName}`;
            manifest.artifacts[platform] = {
              name: fileName,
              r2Key,
              url: `${process.env.BASE_URL}/${r2Key}`,
              size: bytes.length,
              sha256: crypto.createHash("sha256").update(bytes).digest("hex"),
            };
          }

          fs.writeFileSync("release-artifacts/manifest.json", `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Upload artifacts to R2
        run: |
          set -euo pipefail
          version=$(node -p "require('./release-artifacts/manifest.json').version")

          npx --yes wrangler@4 r2 object put "$R2_BUCKET/download/$version/VVVPN-Android.apk" \
            --file "release-artifacts/VVVPN-Android.apk" \
            --content-type "application/vnd.android.package-archive" \
            --remote
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/download/$version/VVVPN-Windows-Portable-x64.zip" \
            --file "release-artifacts/VVVPN-Windows-Portable-x64.zip" \
            --content-type "application/zip" \
            --remote
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/download/$version/VVVPN-macOS.dmg" \
            --file "release-artifacts/VVVPN-macOS.dmg" \
            --content-type "application/x-apple-diskimage" \
            --remote
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/download/$version/VVVPN-Linux-x64.AppImage" \
            --file "release-artifacts/VVVPN-Linux-x64.AppImage" \
            --content-type "application/octet-stream" \
            --remote
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/download/manifest.json" \
            --file "release-artifacts/manifest.json" \
            --content-type "application/json" \
            --remote
